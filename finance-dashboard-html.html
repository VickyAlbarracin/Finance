<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<style>
  :root {
    --bg: #0a0e1a; --surface: #131826; --surface2: #1a2030;
    --border: #1e2536; --border2: #2a3346;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --cyan: #22d3ee; --purple: #a78bfa; --orange: #fb923c;
    --green: #34d399; --red: #f87171; --yellow: #facc15; --blue: #60a5fa;
    --grad: linear-gradient(90deg,#22d3ee,#a78bfa);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
  h1,h2,h3,h4 { font-weight: 700; }
  input, select, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px; width: 100%; outline: none;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--cyan); }
  button { cursor: pointer; font-family: inherit; border: none; }
  .btn-primary {
    background: var(--cyan); color: #0a0e1a; font-weight: 700;
    padding: 9px 16px; border-radius: 10px; font-size: 13px;
  }
  .btn-secondary {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
    padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
  }
  .btn-icon {
    background: none; border: none; color: var(--text3); padding: 6px;
    border-radius: 8px; display: inline-flex; align-items: center;
  }
  .btn-icon:hover { color: var(--red); background: rgba(248,113,113,0.1); }
  .btn-edit { background: none; border: none; color: var(--text3); padding: 6px; border-radius: 8px; display: inline-flex; align-items: center; }
  .btn-edit:hover { color: var(--cyan); background: rgba(34,211,238,0.1); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  .card-lg { border-radius: 16px; padding: 20px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 18px; padding: 22px; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-wide { max-width: 560px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  .tag {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .tag-green { background: rgba(52,211,153,0.15); color: var(--green); }
  .tag-red { background: rgba(248,113,113,0.15); color: var(--red); }
  .tag-yellow { background: rgba(250,204,21,0.15); color: var(--yellow); }
  .tag-blue { background: rgba(96,165,250,0.15); color: var(--blue); }
  .tag-purple { background: rgba(167,139,250,0.15); color: var(--purple); }
  .tag-orange { background: rgba(251,146,60,0.15); color: var(--orange); }
  .progress-bar { width: 100%; height: 10px; background: var(--border); border-radius: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 8px; transition: width 0.3s; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-label { font-size: 12.5px; color: var(--text2); }
  .stat-value { font-size: 18px; font-weight: 700; }
  .stat-sub { font-size: 11.5px; color: var(--text3); }
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  nav {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 22px; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 10px; border: none;
    font-size: 13.5px; font-weight: 600; white-space: nowrap;
    background: transparent; color: var(--text3);
  }
  .nav-btn.active {
    background: var(--surface2); color: var(--cyan);
    box-shadow: inset 0 0 0 1px var(--border2);
  }
  .alert {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    margin-bottom: 14px;
  }
  .alert-red { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.25); color: var(--red); }
  .alert-yellow { background: rgba(250,204,21,0.12); border: 1px solid rgba(250,204,21,0.25); color: var(--yellow); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .sync-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--text3);
    margin-bottom: 16px; gap: 8px; flex-wrap: wrap;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; }
  .sync-dot.offline { background: var(--yellow); }
  .cuota-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .cuota-row:last-child { border-bottom: none; }
  .pill-btn {
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); cursor:pointer;
  }
  .pill-btn.active { background: var(--cyan); color: #0a0e1a; border-color: var(--cyan); }
  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="lock-screen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px">
  <div style="font-size:40px">🔒</div>
  <h2 style="color:#e2e8f0;font-family:Inter,system-ui,sans-serif;font-size:18px">Mis Finanzas</h2>
  <input id="lock-input" type="password" placeholder="Código de acceso" inputmode="numeric"
    style="background:#0a0e1a;color:#e2e8f0;border:1px solid #2a3346;border-radius:10px;padding:12px 16px;font-size:16px;text-align:center;width:220px;outline:none">
  <button id="lock-btn" style="background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#0a0e1a;font-weight:700;padding:10px 24px;border-radius:10px;border:none;font-size:14px;cursor:pointer;width:220px">Ingresar</button>
  <p id="lock-error" style="color:#f87171;font-size:13px;display:none;font-family:Inter,system-ui,sans-serif">Código incorrecto</p>
</div>
<div id="app" style="max-width:1100px;margin:0 auto;padding:20px 14px 80px;display:none"></div>

<script>
// ============================================================
// PANTALLA DE ACCESO
// ============================================================
const ACCESS_CODE = "080502";
const lockScreen = document.getElementById('lock-screen');
const appDiv = document.getElementById('app');
const lockInput = document.getElementById('lock-input');
const lockBtn = document.getElementById('lock-btn');
const lockError = document.getElementById('lock-error');

function tryUnlock() {
  if (lockInput.value === ACCESS_CODE) {
    sessionStorage.setItem('finanzas_unlocked', 'true');
    lockScreen.style.display = 'none';
    appDiv.style.display = '';
    window.initApp();
  } else {
    lockError.style.display = 'block';
    lockInput.value = '';
  }
}
lockBtn.addEventListener('click', tryUnlock);
lockInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('finanzas_unlocked') === 'true') {
    lockScreen.style.display = 'none';
    appDiv.style.display = '';
    window.initApp();
  } else {
    lockInput.focus();
  }
});

// ============================================================
// CONFIG — PEGÁ TU URL DE APPS SCRIPT ACÁ
// ============================================================
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyXAM_5jVxgy-Wpu5ML8Yn5qUCZ6V0CCaiEIm1nYNFTLPznjGFaMsLcODnGWV2oXqf6nw/exec";

// ============================================================
// ESTADO GLOBAL
// ============================================================
const CATEGORIES = ['Comida','Transporte','Viajes','Servicios','Entretenimiento','Salud','Educacion','Ropa','Otros'];
const COLORS = ['#22d3ee','#a78bfa','#fb923c','#34d399','#f472b6','#facc15','#60a5fa','#94a3b8','#e879f9'];
const INVEST_TYPES = ['Acciones','Bonos','CEDEARs'];
const INVEST_COLORS = { Acciones:'#22d3ee', Bonos:'#a78bfa', CEDEARs:'#fb923c' };
const PAY_METHODS = ['Efectivo','Débito','Transferencia','Crédito'];
const INVEST_OPTIONS = {
  Acciones: ['AGRO','ALUA','BBAR','BMA','GGAL','LOMA','PAMP','TGSU2','TXAR','YPFD'],
  Bonos: ['AL30','GD38'],
  CEDEARs: ['DIA','IWM','SPY']
};
const BAR_COLORS_LIST = ['#22d3ee','#a78bfa','#fb923c','#34d399','#f472b6','#facc15','#60a5fa','#e879f9'];

let state = {
  movements: [],       // {id, type, amount, currency, category, description, date, payMethod, cardId, installments, installmentAmount, installmentIndex}
  installments: [],    // {id, movId, cardId, amount, currency, month, paid, arrastrada}
  cards: [],           // {id, name, monthDates: {'2026-06': {close:27, due:10}}}
  investments: { Acciones:[], Bonos:[], CEDEARs:[] }, // [{id,name,amount,currency}]
  investHistory: [],   // {id,date,type,name,amount,currency,action}
  investSnapshots: [], // {id, month, type, name, currency, contribution, value}
  budgets: {},         // {'2026-06': {ARS:0, USD:0}}
};

let currency = 'ARS';
let activeTab = 'home';
let syncStatus = 'idle'; // idle | syncing | ok | error
let lastSync = null;
let offlineMode = !SHEET_URL;
let investChartMode = 'total'; // 'total' o el nombre de un bien específico

// ============================================================
// UTILS
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() { return new Date().toISOString().slice(0,10); }
function curMonth() { return today().slice(0,7); }
function monthOf(dateStr) { return dateStr.slice(0,7); }
function fmt(n, cur) {
  return new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0) + ' ' + cur;
}
function monthName(ym) {
  const [y,m] = ym.split('-');
  return new Date(y, m-1, 1).toLocaleString('es-AR',{month:'long',year:'numeric'});
}
function monthShort(ym) {
  const [y,m] = ym.split('-');
  return new Date(y, m-1, 1).toLocaleString('es-AR',{month:'short'}).replace('.','');
}
function addMonths(ym, n) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.toISOString().slice(0,7);
}
function saveLocal() { localStorage.setItem('finanzas_v2', JSON.stringify(state)); }
function loadLocal() {
  const d = localStorage.getItem('finanzas_v2');
  if (d) { try { state = {...state, ...JSON.parse(d)}; } catch(e){} }
}

// ============================================================
// SYNC CON GOOGLE SHEETS
// ============================================================
async function syncToSheet(action, payload) {
  if (!SHEET_URL) return { ok: false, offline: true };
  syncStatus = 'syncing';
  renderSyncBar();
  try {
    const formData = new FormData();
    formData.append('action', action);
    formData.append('payload', JSON.stringify(payload));
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      body: formData,
      redirect: 'follow'
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = { ok: false, error: 'respuesta no válida' }; }
    syncStatus = data.ok !== false ? 'ok' : 'error';
    lastSync = new Date();
    renderSyncBar();
    return data;
  } catch(e) {
    syncStatus = 'error';
    renderSyncBar();
    return { ok: false, error: e.message };
  }
}

async function loadFromSheet() {
  if (!SHEET_URL) { loadLocal(); render(); return; }
  syncStatus = 'syncing'; renderSyncBar();
  try {
    const res = await fetch(SHEET_URL + '?action=getAll');
    const data = await res.json();
    if (data.state) { state = data.state; saveLocal(); }
    syncStatus = 'ok'; lastSync = new Date();
  } catch(e) {
    loadLocal();
    syncStatus = 'error';
  }
  render();
}

async function pushState() {
  saveLocal();
  await syncToSheet('setState', state);
  render();
}

// ============================================================
// LÓGICA DE CUOTAS Y TARJETAS
// ============================================================
function getCardCloseDay(cardId, month) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card || !card.monthDates) return null;
  return (card.monthDates[month] || {}).close || null;
}

function determineFirstInstallmentMonth(cardId, date) {
  const dateObj = new Date(date + 'T12:00:00');
  const month = date.slice(0,7);
  const closeDay = getCardCloseDay(cardId, month);

  if (!closeDay) return addMonths(month, 1);

  const dayOfMonth = dateObj.getDate();
  if (dayOfMonth > closeDay) {
    // Después del cierre → entra en el mes que sigue al siguiente
    return addMonths(month, 2);
  } else {
    // Antes o igual al cierre → entra el mes siguiente
    return addMonths(month, 1);
  }
}

function generateInstallments(mov) {
  // Eliminar cuotas anteriores de este movimiento
  state.installments = state.installments.filter(i => i.movId !== mov.id);

  if (mov.payMethod !== 'Crédito' || mov.installments <= 1) return;

  const firstMonth = determineFirstInstallmentMonth(mov.cardId, mov.date);

  for (let i = 0; i < mov.installments; i++) {
    const month = addMonths(firstMonth, i);
    state.installments.push({
      id: uid(),
      movId: mov.id,
      cardId: mov.cardId,
      amount: mov.installmentAmount,
      currency: mov.currency,
      month,
      paid: false,
      arrastrada: false,
      num: i + 1,
      total: mov.installments
    });
  }
}

function procesarArrastres() {
  const cm = curMonth();
  state.installments.forEach(inst => {
    if (!inst.paid && inst.month < cm) {
      // Cuota vencida no pagada → arrastrar al mes siguiente
      const newMonth = addMonths(inst.month, 1);
      if (newMonth <= cm) {
        inst.month = newMonth;
        inst.arrastrada = true;
      }
    }
  });
}

function getInstallmentsForMonth(month) {
  return state.installments.filter(i => i.month === month);
}

function getInstallmentsForCard(cardId) {
  return state.installments.filter(i => i.cardId === cardId);
}

function installmentsTotalForCardMonth(cardId, month) {
  return state.installments
    .filter(i => i.cardId === cardId && i.month === month)
    .reduce((s,i) => s + Number(i.amount), 0);
}

function totalInstallmentsByMonth(month, cur) {
  return state.installments
    .filter(i => i.month === month && i.currency === cur)
    .reduce((s,i) => s + Number(i.amount), 0);
}

// Proyección próximos N meses
function installmentProjection(months, cur) {
  const result = [];
  for (let i = 0; i < months; i++) {
    const m = addMonths(curMonth(), i + 1);
    result.push({ month: m, total: totalInstallmentsByMonth(m, cur) });
  }
  return result;
}

// ============================================================
// GASTOS DEL MES (efectivo + débito + transferencia + cuotas que caen)
// ============================================================
function monthlyExpenses(month, cur) {
  // Gastos directos (no cuotas o cuotas ya integradas en cuota mensual)
  const direct = state.movements
    .filter(m => m.type === 'gasto' && monthOf(m.date) === month && m.currency === cur && m.payMethod !== 'Crédito')
    .reduce((s,m) => s + Number(m.amount), 0);
  // Cuotas que caen este mes
  const installmentsTotal = totalInstallmentsByMonth(month, cur);
  return direct + installmentsTotal;
}

function monthlyIncome(month, cur) {
  return state.movements
    .filter(m => m.type === 'ingreso' && monthOf(m.date) === month && m.currency === cur)
    .reduce((s,m) => s + Number(m.amount), 0);
}

// Total comprometido = gastos mes actual + cuotas futuras pendientes
function totalCommitted(cur) {
  const cm = curMonth();
  const thisMonth = monthlyExpenses(cm, cur);
  const future = state.installments
    .filter(i => i.month > cm && i.currency === cur && !i.paid)
    .reduce((s,i) => s + Number(i.amount), 0);
  return thisMonth + future;
}

// ============================================================
// SNAPSHOTS MENSUALES DE INVERSIONES
// ============================================================
function getAllInvestKeys() {
  // Devuelve [{type,name,currency}] para cada bien existente (cargado en investments)
  const keys = [];
  INVEST_TYPES.forEach(type => {
    (state.investments[type]||[]).forEach(it => {
      if (!keys.find(k=>k.type===type&&k.name===it.name&&k.currency===it.currency)) {
        keys.push({type, name: it.name, currency: it.currency});
      }
    });
  });
  return keys;
}

function getSnapshot(type, name, currency, month) {
  return state.investSnapshots.find(s=>s.type===type&&s.name===name&&s.currency===currency&&s.month===month);
}

function getPrevSnapshotValue(type, name, currency, beforeMonth) {
  const snaps = state.investSnapshots
    .filter(s=>s.type===type&&s.name===name&&s.currency===currency&&s.month<beforeMonth)
    .sort((a,b)=>b.month.localeCompare(a.month));
  return snaps.length ? snaps[0].value : null;
}

function getAllMonthsWithSnapshots() {
  const months = new Set(state.investSnapshots.map(s=>s.month));
  return [...months].sort();
}

function setSnapshot(type, name, currency, month, contribution, value) {
  state.investSnapshots = state.investSnapshots.filter(s=>!(s.type===type&&s.name===name&&s.currency===currency&&s.month===month));
  state.investSnapshots.push({ id: uid(), type, name, currency, month, contribution: Number(contribution)||0, value: Number(value)||0 });
}

// Valor total de la cartera (en una moneda) para un mes dado: usa el último snapshot <= ese mes para cada bien
function portfolioValueForMonth(month, cur) {
  const keys = getAllInvestKeys().filter(k=>k.currency===cur);
  let total = 0;
  keys.forEach(k => {
    const snaps = state.investSnapshots
      .filter(s=>s.type===k.type&&s.name===k.name&&s.currency===k.currency&&s.month<=month)
      .sort((a,b)=>b.month.localeCompare(a.month));
    if (snaps.length) total += snaps[0].value;
  });
  return total;
}

function portfolioContributionForMonth(month, cur) {
  return state.investSnapshots
    .filter(s=>s.currency===cur&&s.month===month)
    .reduce((sum,s)=>sum+Number(s.contribution),0);
}

function portfolioVariationForMonth(month, cur) {
  const keys = getAllInvestKeys().filter(k=>k.currency===cur);
  let variation = 0;
  keys.forEach(k => {
    const snap = getSnapshot(k.type,k.name,k.currency,month);
    if (!snap) return;
    const prevVal = getPrevSnapshotValue(k.type,k.name,k.currency,month);
    if (prevVal === null) return; // primer snapshot, no hay variación que calcular
    const expected = prevVal + Number(snap.contribution);
    variation += (snap.value - expected);
  });
  return variation;
}

// ============================================================
// EXPORT / IMPORT JSON
// ============================================================
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `finanzas_${today()}.json`;
  a.click();
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const imported = JSON.parse(text);
      state = {...state, ...imported};
      if (!state.investSnapshots) state.investSnapshots = [];
      await pushState();
      render();
      alert('✅ Datos importados correctamente');
    } catch(err) { alert('❌ Archivo inválido'); }
  };
  input.click();
}

// ============================================================
// RENDER ENGINE
// ============================================================
function $(id) { return document.getElementById(id); }
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if (k === 'className') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function html(str) { const d = document.createElement('div'); d.innerHTML = str; return d; }

function render() {
  procesarArrastres();
  const app = $('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderSyncBarEl());
  app.appendChild(renderNav());
  const content = document.createElement('div');
  if (activeTab === 'home') content.appendChild(renderHome());
  else if (activeTab === 'movements') content.appendChild(renderMovements());
  else if (activeTab === 'cards') content.appendChild(renderCards());
  else if (activeTab === 'invest') content.appendChild(renderInvest());
  app.appendChild(content);
}

function renderHeader() {
  const cm = curMonth();
  return el('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px',flexWrap:'wrap',gap:'10px'}},
    el('div', {},
      el('h1', {style:{fontSize:'22px',color:'var(--cyan)'}}, '💰 Mis Finanzas'),
      el('p', {style:{color:'var(--text3)',fontSize:'12px',marginTop:'2px'}}, monthName(cm))
    ),
    el('div', {style:{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}},

// ============================================================
// HOME
// ============================================================
function renderHome() {
  const cm = curMonth();
  const income = { ARS: monthlyIncome(cm,'ARS'), USD: monthlyIncome(cm,'USD') };
  const expenses = { ARS: monthlyExpenses(cm,'ARS'), USD: monthlyExpenses(cm,'USD') };
  const balance = { ARS: income.ARS-expenses.ARS, USD: income.USD-expenses.USD };
  const committed = { ARS: totalCommitted('ARS'), USD: totalCommitted('USD') };
  const budget = state.budgets[cm] || { ARS:0, USD:0 };
  const pctARS = budget.ARS > 0 ? Math.min((expenses.ARS / budget.ARS) * 100, 100) : 0;
  const budgetStatus = pctARS >= 100 ? 'over' : pctARS >= 80 ? 'warn' : 'ok';
  const statusColor = budgetStatus === 'over' ? 'var(--red)' : budgetStatus === 'warn' ? 'var(--yellow)' : 'var(--green)';
  const projectionARS = installmentProjection(3, 'ARS');
  const projectionUSD = installmentProjection(3, 'USD');

  const div = document.createElement('div');

  // Stats row
  const statsGrid = el('div', {className:'grid-3', style:{marginBottom:'16px'}},
    statCard('Ingresos del mes', income, '', 'var(--green)', '📥'),
    statCard('Gastos del mes', expenses, 'Efectivo + débito + transferencia + cuotas que caen', 'var(--red)', '📤'),
    statCard('Balance', balance, '', balance.ARS >= 0 ? 'var(--green)' : 'var(--red)', '⚖️'),
    statCard('Total comprometido', committed, 'Este mes + cuotas futuras pendientes', 'var(--orange)', '📊'),
  );
  div.appendChild(statsGrid);

  // Budget (ARS como moneda principal de presupuesto)
  const budgetDiv = el('div', {className:'card card-lg', style:{marginBottom:'16px'}});
  const budgetHeader = el('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},
    el('h3', {style:{fontSize:'15px'}}, `Presupuesto del mes (ARS)`),
    budgetStatus !== 'ok' ? el('span', {style:{color:statusColor,fontSize:'12.5px',fontWeight:'600'}},
      budgetStatus === 'over' ? '🚨 ¡Superaste el presupuesto!' : '⚠️ Cerca del límite'
    ) : el('span',{})
  );
  budgetDiv.appendChild(budgetHeader);
  if (budget.ARS > 0) {
    budgetDiv.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',color:'var(--text2)',marginBottom:'8px'}},
      el('span',{},`${fmt(expenses.ARS,'ARS')} gastado`),
      el('span',{},`de ${fmt(budget.ARS,'ARS')}`)
    ));
    const bar = el('div',{className:'progress-bar'}, el('div',{className:'progress-fill',style:{width:pctARS+'%',background:statusColor}}));
    budgetDiv.appendChild(bar);
    budgetDiv.appendChild(el('p',{style:{fontSize:'11.5px',color:'var(--text3)',marginTop:'6px'}},`${pctARS.toFixed(1)}% utilizado`));
  } else {
    budgetDiv.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'13px',marginBottom:'10px'}},`No definiste presupuesto para ${monthName(cm)}.`));
  }
  const budgetRow = el('div',{className:'row',style:{marginTop:'12px'}});
  const budgetInput = el('input',{type:'number',placeholder:`Presupuesto en ARS`,style:{flex:'1'}});
  const budgetBtn = el('button',{className:'btn-primary',onClick:async ()=>{
    const v = Number(budgetInput.value);
    if (!v || v <= 0) return;
    if (!state.budgets[cm]) state.budgets[cm] = {ARS:0,USD:0};
    state.budgets[cm].ARS = v;
    await pushState();
  }}, 'Definir');
  budgetRow.appendChild(budgetInput); budgetRow.appendChild(budgetBtn);
  budgetDiv.appendChild(budgetRow);
  div.appendChild(budgetDiv);

  // Proyección de cuotas (ARS, y USD si hay)
  if (projectionARS.some(p => p.total > 0) || projectionUSD.some(p => p.total > 0)) {
    const projDiv = el('div',{className:'card card-lg',style:{marginBottom:'16px'}});
    projDiv.appendChild(el('h3',{style:{fontSize:'15px',marginBottom:'14px'}},`📅 Cuotas comprometidas próximos 3 meses`));
    const projGrid = el('div',{className:'grid-3'});
    projectionARS.forEach((p,i) => {
      const valObj = { ARS: p.total, USD: projectionUSD[i].total };
      projGrid.appendChild(statCard(monthName(p.month), valObj, 'en cuotas', p.total > 0 || projectionUSD[i].total>0 ? 'var(--orange)' : 'var(--text3)', '📆'));
    });
    projDiv.appendChild(projGrid);
    div.appendChild(projDiv);
  }

  // Category breakdown (ARS principal)
  const catDiv = el('div',{className:'card card-lg'});
  catDiv.appendChild(el('h3',{style:{fontSize:'15px',marginBottom:'14px'}},`Gastos por categoría — ARS`));
  const catData = CATEGORIES.map((c,i) => {
    const total = state.movements
      .filter(m => m.type==='gasto' && monthOf(m.date)===cm && m.currency==='ARS' && m.category===c && m.payMethod!=='Crédito')
      .reduce((s,m)=>s+Number(m.amount),0);
    return {cat:c,total,color:COLORS[i]};
  }).filter(d=>d.total>0).sort((a,b)=>b.total-a.total);

  if (catData.length === 0) {
    catDiv.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'13px'}},'Sin gastos este mes todavía.'));
  } else {
    const maxVal = catData[0].total;
    catData.forEach(d => {
      const row = el('div',{style:{marginBottom:'10px'}});
      row.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'5px'}},
        el('span',{},d.cat), el('span',{style:{fontWeight:'700'}},fmt(d.total,'ARS'))
      ));
      row.appendChild(el('div',{className:'progress-bar'},
        el('div',{className:'progress-fill',style:{width:((d.total/maxVal)*100)+'%',background:d.color}})
      ));
      catDiv.appendChild(row);
    });
  }
  div.appendChild(catDiv);
  return div;
}

function statCard(label, valueObj, sub, color, icon) {
  // valueObj puede ser un string (compatibilidad) o {ARS, USD}
  const d = el('div',{className:'stat-card'});
  d.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
    el('span',{className:'stat-label'},label),
    el('span',{style:{fontSize:'20px'}},icon||'')
  ));
  if (typeof valueObj === 'string') {
    d.appendChild(el('div',{className:'stat-value',style:{color}},valueObj));
  } else {
    d.appendChild(el('div',{className:'stat-value',style:{color}},fmt(valueObj.ARS,'ARS')));
    if (valueObj.USD) {
      d.appendChild(el('div',{className:'stat-value',style:{color,fontSize:'14px',opacity:'0.8'}},fmt(valueObj.USD,'USD')));
    }
  }
  if (sub) d.appendChild(el('div',{className:'stat-sub'},sub));
  return d;
}

function renderCards() {
  const cm = curMonth();

    el('h2',{style:{fontSize:'16px'}},'💳 Tarjetas de Crédito'),

  );

  if (state.cards.length === 0) {
    div.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'13px'}},'No agregaste tarjetas todavía.'));

  }

  state.cards.forEach(card => {
    const monthDates = (card.monthDates||{})[cm]||{};
    const closeDay = monthDates.close||'—';
    const dueDay = monthDates.due||'—';
    const cardInsts = getInstallmentsForCard(card.id);
    const thisMonthInsts = cardInsts.filter(i=>i.month===cm);
    const totalThisMonth = thisMonthInsts.reduce((s,i)=>s+Number(i.amount),0);
    const totalPendingAll = cardInsts.filter(i=>!i.paid).reduce((s,i)=>s+Number(i.amount),0);

    const cardDiv = el('div',{className:'card card-lg',style:{marginBottom:'16px'}});

    // Card header
    cardDiv.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'14px'}},
      el('div',{},
        el('div',{style:{fontSize:'15px',fontWeight:'700',marginBottom:'4px'}},`💳 ${card.name}`),
        el('div',{style:{fontSize:'12px',color:'var(--text3)'}},`Cierre: día ${closeDay} · Vencimiento: día ${dueDay}`)
      ),
      el('div',{style:{display:'flex',gap:'8px'}},
        el('button',{className:'btn-secondary',style:{fontSize:'11.5px'},onClick:()=>openCardDates(card.id,cm)},`✏️ Fechas ${monthName(cm).split(' ')[0]}`),
        el('button',{className:'btn-icon',onClick:async()=>{
          if(!confirm(`¿Eliminar tarjeta "${card.name}"? Esto borrará todas sus cuotas.`)) return;
          state.cards = state.cards.filter(c=>c.id!==card.id);
          state.installments = state.installments.filter(i=>i.cardId!==card.id);
          await pushState();
        }},'🗑')
      )
    ));

    // Totals
    const totalThisMonthObj = { ARS: cardInsts.filter(i=>i.month===cm&&i.currency==='ARS').reduce((s,i)=>s+Number(i.amount),0), USD: cardInsts.filter(i=>i.month===cm&&i.currency==='USD').reduce((s,i)=>s+Number(i.amount),0) };
    const totalPendingObj = { ARS: cardInsts.filter(i=>!i.paid&&i.currency==='ARS').reduce((s,i)=>s+Number(i.amount),0), USD: cardInsts.filter(i=>!i.paid&&i.currency==='USD').reduce((s,i)=>s+Number(i.amount),0) };
    const totalsRow = el('div',{className:'grid-3',style:{marginBottom:'14px'}});
    totalsRow.appendChild(statCard('A pagar este mes', totalThisMonthObj, monthName(cm), 'var(--red)', '📅'));

    cardDiv.appendChild(totalsRow);

    // Installments list
    if (cardInsts.length === 0) {
      cardDiv.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'12.5px'}},'Sin gastos en cuotas registrados.'));
    } else {
      cardDiv.appendChild(el('div',{style:{borderTop:'1px solid var(--border)',paddingTop:'12px'}},
        el('h4',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'10px'}},'Detalle de cuotas'),
        ...groupInstallmentsByMov(cardInsts).map(group => {
          const mov = state.movements.find(m=>m.id===group.movId);
          const paidCount = group.installments.filter(i=>i.paid).length;
          const wrapper = el('div',{style:{marginBottom:'12px',background:'var(--surface2)',borderRadius:'10px',padding:'10px'}});
          wrapper.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}},
            el('div',{},
              el('div',{style:{fontSize:'13px',fontWeight:'600'}},mov?.description||'Gasto en cuotas'),
              el('div',{style:{fontSize:'11.5px',color:'var(--text3)'}},`${group.installments.length} cuotas · ${paidCount} pagadas`)
            ),
            el('span',{className:'tag tag-purple'},fmt(group.installments[0]?.amount||0,group.installments[0]?.currency||'ARS')+'/mes')
          ));
          group.installments.sort((a,b)=>a.month.localeCompare(b.month)).forEach(inst => {
            wrapper.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderTop:'1px solid var(--border)',fontSize:'12px'}},
              el('span',{style:{color: inst.month < curMonth() && !inst.paid ? 'var(--red)' : 'var(--text2)'}},
                `${monthName(inst.month)}` + (inst.arrastrada?' ⚠️':'') + (inst.month===cm?' ← Este mes':'')
              ),
              el('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},
                el('span',{style:{fontWeight:'600',color:inst.paid?'var(--green)':'var(--text)'}},fmt(inst.amount,inst.currency)),
                el('button',{
                  style:{fontSize:'10px',padding:'3px 8px',borderRadius:'6px',border:'none',cursor:'pointer',
                    background:inst.paid?'rgba(52,211,153,0.2)':'var(--border2)',
                    color:inst.paid?'var(--green)':'var(--text2)'},
                  onClick:async()=>{ inst.paid=!inst.paid; await pushState(); }
                },inst.paid?'✅':'○')
              )
            ));
          });
          return wrapper;
        })
      ));
    }

    div.appendChild(cardDiv);
  });
  return div;
}

function groupInstallmentsByMov(insts) {
  const map = {};
  insts.forEach(i => {
    if (!map[i.movId]) map[i.movId] = { movId:i.movId, installments:[] };
    map[i.movId].installments.push(i);
  });
  return Object.values(map);
}

function renderInvest() {
  const cm = curMonth();
  const div = document.createElement('div');

        onClick: () => { currency = c; render(); }
      }, c))
    )
  ));

  // Grand totals
  const grandTotal = { ARS:0, USD:0 };
  INVEST_TYPES.forEach(type => {
    (state.investments[type]||[]).forEach(it => { grandTotal[it.currency] += Number(it.amount); });
  });
  const typeTotal = {};
  INVEST_TYPES.forEach(type => {
    typeTotal[type] = { ARS:0, USD:0 };
    (state.investments[type]||[]).forEach(it => { typeTotal[type][it.currency] += Number(it.amount); });
  });

  // Top stats
  const sg = el('div',{className:'grid-3',style:{marginBottom:'16px'}});
  sg.appendChild(statCard(`Total invertido (${currency})`, fmt(grandTotal[currency],currency),'','var(--purple)','💼'));
  INVEST_TYPES.forEach(type => {
    const pct = grandTotal[currency]>0 ? ((typeTotal[type][currency]/grandTotal[currency])*100).toFixed(1)+'%' : '0%';
    sg.appendChild(statCard(type, fmt(typeTotal[type][currency],currency), pct+' del total', INVEST_COLORS[type], type==='Acciones'?'📈':type==='Bonos'?'🏦':'🌐'));
  });
  div.appendChild(sg);

  // Resumen del mes actual (aporte + variación)
  const monthContribution = portfolioContributionForMonth(cm, currency);
  const monthVariation = portfolioVariationForMonth(cm, currency);
  const hasSnapshotsThisMonth = state.investSnapshots.some(s=>s.month===cm&&s.currency===currency);
  if (hasSnapshotsThisMonth) {

function lineChart(data, cur) {
  // data: [{month, value}]
  const w = 600, h = 220, padL = 50, padR = 16, padT = 16, padB = 28;
  const wrapper = document.createElement('div');
  if (data.length === 0) { wrapper.innerHTML = '<p style="color:#64748b;font-size:13px">Sin datos.</p>'; return wrapper; }

  const values = data.map(d=>d.value);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min = min*0.95; max = max*1.05 || 1; }
  const range = max - min || 1;

  const stepX = data.length > 1 ? (w-padL-padR)/(data.length-1) : 0;
  const points = data.map((d,i) => {
    const x = padL + i*stepX;
    const y = padT + (1 - (d.value-min)/range) * (h-padT-padB);
    return {x,y,...d};
  });

  const pathD = points.map((p,i) => (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${h-padB} L${points[0].x.toFixed(1)},${h-padB} Z`;

  const trendUp = points[points.length-1].value >= points[0].value;
  const lineColor = trendUp ? '#34d399' : '#f87171';

  let svg = `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible">`;
  // grid lines
  for (let i=0;i<=3;i++) {
    const gy = padT + i*(h-padT-padB)/3;
    svg += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#1e2536" stroke-width="1"/>`;
  }
  svg += `<path d="${areaD}" fill="${lineColor}" opacity="0.12"/>`;
  svg += `<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2.5"/>`;
  points.forEach(p => {
    svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${lineColor}"/>`;
  });
  // x labels
  points.forEach((p,i) => {
    if (data.length > 8 && i % Math.ceil(data.length/8) !== 0 && i !== points.length-1) return;
    svg += `<text x="${p.x.toFixed(1)}" y="${h-8}" font-size="10" fill="#64748b" text-anchor="middle">${monthShort(p.month)}</text>`;
  });
  svg += `</svg>`;

  wrapper.innerHTML = svg;
  return wrapper;
}

function simplePie(data, total) {
  const size = 180; const cx = 90; const cy = 90; const r = 70;
  let startAngle = -Math.PI/2;
  const slices = data.map(d => {
    const angle = (d.value/total)*2*Math.PI;
    const x1 = cx + r*Math.cos(startAngle);
    const y1 = cy + r*Math.sin(startAngle);
    startAngle += angle;
    const x2 = cx + r*Math.cos(startAngle);
    const y2 = cy + r*Math.sin(startAngle);
    const large = angle > Math.PI ? 1 : 0;
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${d.color}" opacity="0.9"/>`;
  });
  const legend = data.map(d=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:${d.color};display:inline-block"></span>${d.name}: ${((d.value/total)*100).toFixed(1)}%</div>`).join('');
  const wrapper = document.createElement('div');
  wrapper.style.display='flex';wrapper.style.alignItems='center';wrapper.style.justifyContent='center';wrapper.style.gap='24px';wrapper.style.flexWrap='wrap';
  wrapper.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices.join('')}<circle cx="${cx}" cy="${cy}" r="35" fill="var(--surface)"/></svg><div style="display:flex;flex-direction:column;gap:8px">${legend}</div>`;
  return wrapper;
}

  }

  // Category breakdown
  div.appendChild(el('h4',{style:{color:'var(--text2)',fontSize:'13px',margin:'14px 0 8px'}},'Gastos por categoría'));
  const catData = CATEGORIES.map(c=>({cat:c,total:state.movements.filter(m=>m.type==='gasto'&&monthOf(m.date)===cm&&m.currency===currency&&m.category===c&&m.payMethod!=='Crédito').reduce((s,m)=>s+Number(m.amount),0)})).filter(d=>d.total>0);
  if (catData.length===0) div.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'12.5px'}},'Sin datos.'));
  else catData.sort((a,b)=>b.total-a.total).forEach(d=>{
    div.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'5px 0',borderBottom:'1px solid var(--border)'}},
      el('span',{},d.cat), el('span',{style:{fontWeight:'700'}},fmt(d.total,currency))
    ));
  });

  // Cards
  if (state.cards.length>0) {
    div.appendChild(el('h4',{style:{color:'var(--text2)',fontSize:'13px',margin:'14px 0 8px'}},'Cuotas de tarjetas — este mes'));
    state.cards.forEach(c=>{
      const t=installmentsTotalForCardMonth(c.id,cm);
      if(t>0) div.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'5px 0',borderBottom:'1px solid var(--border)'}},
        el('span',{},c.name),el('span',{style:{fontWeight:'700',color:'var(--orange)'}},fmt(t,currency))
      ));
    });
  }

  // Investments
  const grandT={ARS:0,USD:0};
  INVEST_TYPES.forEach(type=>{(state.investments[type]||[]).forEach(it=>{grandT[it.currency]+=Number(it.amount);});});
  div.appendChild(el('h4',{style:{color:'var(--text2)',fontSize:'13px',margin:'14px 0 8px'}},'Inversiones'));
  div.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'5px 0',fontWeight:'700'}},
    el('span',{},'Total invertido'), el('span',{},fmt(grandT[currency],currency))
  ));
  const monthVariation = portfolioVariationForMonth(cm, currency);
  if (state.investSnapshots.some(s=>s.month===cm&&s.currency===currency)) {
    div.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'5px 0'}},
      el('span',{},'Variación real del mes'), el('span',{style:{fontWeight:'700',color:monthVariation>=0?'var(--green)':'var(--red)'}},(monthVariation>=0?'+':'')+fmt(monthVariation,currency))
    ));
  }

  openModal(div,'📋 Reporte mensual',true);
}

// ============================================================
// INIT
// ============================================================
window.initApp = function() {
  loadLocal();
  if (!state.investSnapshots) state.investSnapshots = [];
  loadFromSheet();
}
</script>
</body>
</html>
